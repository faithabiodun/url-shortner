# loads my .env file so DATABASE_USERNAME / DATABASE_PASSWORD resolve locally
spring.config.import=optional:file:.env[.properties]
# Local default is localhost Postgres. Docker Compose and Render override
# these with SPRING_DATASOURCE_* env vars (see docker-compose.yml, render.yaml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:password}}
# update = Hibernate creates/updates my short_urls table from my ShortUrl.java, so I skip hand-written SQL
spring.jpa.hibernate.ddl-auto=update
# show-sql = I see the SQL my repo calls generate, so I learn what JPA does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Render sets PORT itself (default 10000). ${PORT:8080} uses Render's port
# in the cloud but keeps 8080 for local Docker / IntelliJ.
server.port=${PORT:8080}
# Actuator: health/info for deploy platforms and portfolio demo
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=url-shortener
info.app.version=1.0.0
