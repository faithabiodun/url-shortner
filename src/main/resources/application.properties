# I'm pointing my app at my local Postgres database
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=urluser
spring.datasource.password=urlpass
# update = Hibernate creates/updates my short_urls table from my ShortUrl.java, so I skip hand-written SQL
spring.jpa.hibernate.ddl-auto=update
# show-sql = I see the SQL my repo calls generate, so I learn what JPA does
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
