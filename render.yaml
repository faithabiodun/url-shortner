# Render blueprint: one Docker web service + one Postgres database.
# Push this file to GitHub, then Render Dashboard -> New -> Blueprint -> select repo.
databases:
  - name: urlshortener-db
    databaseName: urlshortener
    user: urluser
    plan: free

services:
  - type: web
    name: url-shortener
    runtime: docker
    plan: free
    # Render hits this during deploy; deploy fails fast if the app is broken.
    healthCheckPath: /actuator/health
    envVars:
      # JDBC URL derived from Render's postgres:// connection string
      # (converted to jdbc:postgresql:// by the Dockerfile entrypoint).
      - key: DATABASE_URL
        fromDatabase:
          name: urlshortener-db
          property: connectionString
      # Explicit credentials match the URL userinfo (same values, no conflict).
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: urlshortener-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: urlshortener-db
          property: password
